name: Update overlapping item and skill names if necessary
on:
  workflow_dispatch: {}
  schedule:
    - cron: 0 0 * * *
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Update overlapping names from data-of-loathing
        run: yarn run updateOverlappingItemSkillNames

      - name: Format overlapping names
        run: yarn run prettier --write src/overlappingNames.ts

      - name: Build the code
        run: yarn build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Update overlapping item and skill names automatically
          title: Automated updates to overlapping item and skill names
          body: This is an automatically generated PR with updates to the overlapping item and skill names used by libram's combat macros.
          branch: automatic-overlapping-name-updates
          add-paths: src/overlappingNames.ts
